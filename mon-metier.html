<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon métier — Nino — V0.25</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mon-metier-v025.css">
</head>
<body>
  <main class="jobs-page">
    <section class="jobs-compact-header">
      <a class="back jobs-compact-back" href="index.html">← Accueil</a>

      <div class="jobs-compact-main">
        <img class="jobs-compact-nino" src="assets/nino.png" alt="Nino le robot">
        <div class="jobs-compact-text">
          <h1>Mon métier</h1>
          <p>Les métiers changent <strong>chaque lundi</strong>.</p>
          <div class="week-note" id="week-note">🔄 Semaine en cours</div>
        </div>
      </div>
    </section>

    <section class="weekly-draw-card">
      <div>
        <h2>🎲 Répartition de la semaine</h2>
        <p id="draw-status">Nino prépare les métiers…</p>
      </div>
      <button class="draw-button" id="show-all-jobs" type="button">📋 Voir les 12 métiers</button>
    </section>

    <section class="current-jobs" id="current-jobs" aria-label="Métiers attribués cette semaine"></section>

    <section class="all-jobs-panel" id="all-jobs-panel" hidden>
      <h2>Les 12 métiers de la classe</h2>
      <p class="all-jobs-note">
        Les 12 métiers sont attribués chaque semaine : 9 avec un élève et 3 en binôme.
      </p>
      <div class="jobs-grid" id="jobs-grid"></div>
    </section>

    <div class="version-badge">V0.25</div>
  </main>

  <script src="eleves-manifest.js"></script>
  <script src="metiers-v024.js"></script>
</body>
</html>

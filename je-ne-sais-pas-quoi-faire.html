<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Je ne sais pas quoi faire — Nino — V0.9</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="autonomy-page">
    <div class="autonomy-top">
      <a class="back" href="index.html">← Accueil</a>
      <div class="mini-nino">
        <img src="assets/nino.png" alt="Nino le robot">
        <span><strong>Nino est là pour t’aider.</strong></span>
      </div>
    </div>

    <section class="autonomy-intro">
      <h1>Je ne sais pas quoi faire</h1>
      <p>Choisis ce qui ressemble le plus à ta situation.</p>
    </section>

    <section class="choice-grid" aria-label="Choisir ma situation">
      <button class="choice-btn choice-unfinished" data-choice="unfinished" type="button">
        <span class="choice-icon" aria-hidden="true">✅</span>
        <span class="choice-title">Je continue</span>
        <span class="choice-subtitle">Je n’ai pas fini mon travail.</span>
        <span class="choice-desc">Je reprends calmement ce que j’étais en train de faire.</span>
        <span class="choice-cta">Choisir</span>
      </button>

      <button class="choice-btn choice-check" data-choice="check" type="button">
        <span class="choice-icon" aria-hidden="true">🔎</span>
        <span class="choice-title">Je vérifie</span>
        <span class="choice-subtitle">J’ai fini, mais je veux être sûr.</span>
        <span class="choice-desc">Je relis, je corrige et je regarde si tout est complet.</span>
        <span class="choice-cta">Choisir</span>
      </button>

      <button class="choice-btn choice-done" data-choice="done" type="button">
        <span class="choice-icon" aria-hidden="true">🎉</span>
        <span class="choice-title">J’ai terminé</span>
        <span class="choice-subtitle">Mon travail est fini et vérifié.</span>
        <span class="choice-desc">Je peux choisir une activité calme et autonome.</span>
        <span class="choice-cta">Choisir</span>
      </button>

      <button class="choice-btn choice-stuck" data-choice="stuck" type="button">
        <span class="choice-icon" aria-hidden="true">🙋</span>
        <span class="choice-title">J’ai besoin d’aide</span>
        <span class="choice-subtitle">Je n’arrive pas à continuer seul.</span>
        <span class="choice-desc">Je cherche la bonne aide pour avancer.</span>
        <span class="choice-cta">Choisir</span>
      </button>
    </section>

    <section class="nino-answer" id="nino-answer" hidden>
      <div class="answer-head">
        <div class="answer-bubble">🤖 Nino te répond</div>
        <h2 id="answer-title"></h2>
        <p class="answer-subtitle">Lis les étapes et fais-les dans l’ordre.</p>
      </div>
      <div class="action-list" id="action-list"></div>
      <button class="restart" id="restart" type="button">← Choisir une autre situation</button>
    </section>

    <div class="version-badge">V0.9</div>
  </main>

  <script src="autonomie.js"></script>
</body>
</html>

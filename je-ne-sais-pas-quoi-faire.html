<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Je ne sais pas quoi faire — Nino — V0.27</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="autonomy-page">
    <div class="autonomy-top">
      <a class="back" href="index.html">← Accueil</a>
      <div class="mini-nino">
        <img src="assets/nino.png" alt="Nino le robot">
        <span><strong>Nino est là pour t’aider.</strong></span>
      </div>
    </div>

    <section class="autonomy-intro">
      <h1>Je ne sais pas quoi faire</h1>
      <p>Choisis ce qui ressemble le plus à ta situation.</p>
    </section>

    <section class="choice-grid choice-grid-images" aria-label="Choisir ma situation">
      <button class="choice-image-card" data-choice="unfinished" type="button">
        <img src="assets/autonomie/je-continue.png" alt="Je continue">
        <span class="choice-image-subtitle">Je reprends calmement ce que j’étais en train de faire.</span>
      </button>

      <button class="choice-image-card" data-choice="check" type="button">
        <img src="assets/autonomie/je-verifie.png" alt="Je vérifie">
        <span class="choice-image-subtitle">Je veux être sûr que mon travail est prêt.</span>
      </button>

      <button class="choice-image-card" data-choice="done" type="button">
        <img src="assets/autonomie/jai-termine.png" alt="J’ai terminé">
        <span class="choice-image-subtitle">Mon travail est fini et vérifié.</span>
      </button>

      <button class="choice-image-card" data-choice="stuck" type="button">
        <img src="assets/autonomie/jai-besoin-aide.png" alt="J’ai besoin d’aide">
        <span class="choice-image-subtitle">Je n’arrive pas à continuer seul.</span>
      </button>
    </section>

    <section class="nino-answer" id="nino-answer" hidden>
      <div class="answer-head">
        <div class="answer-bubble">🤖 Nino te répond</div>
        <h2 id="answer-title"></h2>
        <p class="answer-subtitle">Lis les étapes et fais-les dans l’ordre.</p>
      </div>
      <div class="action-list" id="action-list"></div>
      <button class="restart" id="restart" type="button">← Choisir une autre situation</button>
    </section>

    <div class="version-badge">V0.27</div>
  </main>

  <script src="autonomie.js"></script>
</body>
</html>

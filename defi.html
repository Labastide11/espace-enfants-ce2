<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Défi du jour — CE2</title>
  <style>
    :root{
      --blue:#0d4c9a; --sky:#eaf8ff; --yellow:#fff3a9; --green:#dff7d8;
      --orange:#ffe0bd; --pink:#ffe2ee; --purple:#eee7ff; --ink:#12325a;
      --card:#fff; --shadow:0 12px 30px rgba(17,71,120,.12);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:linear-gradient(#e9f9ff,#fffdf6);color:var(--ink)}
    .wrap{width:min(1100px,calc(100% - 28px));margin:0 auto;padding:20px 0 40px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
    .back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--blue);font-weight:800;background:#fff;padding:10px 14px;border-radius:999px;box-shadow:var(--shadow)}
    .hero{border-radius:28px;overflow:hidden;box-shadow:var(--shadow);background:#dff5ff}
    .hero img{display:block;width:100%;height:auto}
    .filters{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:20px 0}
    .filter,.random{border:0;border-radius:999px;padding:11px 16px;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 5px 14px rgba(20,70,110,.10)}
    .filter{background:#fff;color:var(--blue)} .filter.active{background:var(--blue);color:#fff}.random{background:#ffd85a;color:#5d4600}
    .challenge{max-width:820px;margin:0 auto;background:#fff;border-radius:28px;padding:26px;box-shadow:var(--shadow);border:4px solid #d9f1ff;text-align:center}
    .badge{display:inline-block;padding:8px 14px;border-radius:999px;font-weight:900;background:var(--purple);margin-bottom:12px}
    .num{font-size:15px;font-weight:900;color:#6b7c91;text-transform:uppercase;letter-spacing:.08em}
    .text{font-size:clamp(24px,4vw,40px);font-weight:900;line-height:1.2;margin:10px 0 22px}
    .actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
    .actions button{border:0;border-radius:16px;padding:13px 18px;font-size:17px;font-weight:900;cursor:pointer}
    .next{background:#18a65b;color:#fff}.all{background:#e8f0ff;color:var(--blue)}
    .grid{display:none;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:22px}
    .grid.show{display:grid}.mini{background:#fff;border-radius:18px;padding:16px;box-shadow:0 6px 18px rgba(18,70,110,.09)}
    .mini strong{display:block;margin-bottom:6px}.mini span{font-weight:700;line-height:1.35}
    @media(max-width:600px){.wrap{width:min(100% - 18px,1100px)}.hero{padding:18px 14px}.challenge{padding:20px 16px}.top{align-items:flex-start}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <a class="back" href="index.html">← Accueil</a>
      <strong>CE2 • Période 1</strong>
    </div>

    <section class="hero" aria-label="Défi du jour">
      <img src="assets/defi-du-jour-cerveau.png"
           alt="Défi du jour : tu as terminé ton travail ? Relis-toi, puis choisis un défi.">
    </section>

    <div class="filters" aria-label="Choisir un domaine">
      <button class="filter active" data-cat="Tous">Tous</button>
      <button class="filter" data-cat="Maths">🔢 Maths</button>
      <button class="filter" data-cat="Français">🔎 Français</button>
      <button class="filter" data-cat="Écriture">✏️ Écriture</button>
      <button class="filter" data-cat="Lecture">📖 Lecture</button>
      <button class="filter" data-cat="Créativité">🎨 Créativité</button>
      <button class="random" id="randomBtn">🎲 Choisis pour moi</button>
    </div>

    <section class="challenge" aria-live="polite">
      <div class="badge" id="badge"></div>
      <div class="num" id="num"></div>
      <div class="text" id="text"></div>
      <div class="actions">
        <button class="next" id="nextBtn">🎲 Un autre défi</button>
        <button class="all" id="allBtn">📚 Voir tous les défis</button>
      </div>
    </section>

    <section class="grid" id="grid" aria-label="Tous les défis"></section>
  </main>

<script>
const challenges = [
  ['Maths','Écris 247 en lettres.'],
  ['Maths','Décompose 583 de deux façons différentes.'],
  ['Maths','Range du plus petit au plus grand : 198 – 281 – 128 – 218.'],
  ['Maths','Complète avec <, > ou = : 356 … 365 / 209 … 190 / 470 … 470.'],
  ['Maths','Calcule : 34 + 25, puis vérifie ton résultat autrement.'],
  ['Maths','Trouve 3 additions différentes dont le résultat est 50.'],
  ['Maths','Je pense à un nombre entre 300 et 400. Son chiffre des dizaines est 5 et son chiffre des unités est 2. Qui suis-je ?'],
  ['Maths','Invente un petit problème dont la réponse est 42.'],
  ['Maths','Écris le nombre juste avant et juste après : 299 ; 450 ; 700.'],
  ['Maths','Dessine sur quadrillage une figure ayant au moins 2 axes de symétrie.'],
  ['Écriture','Écris 3 phrases pour raconter ce que tu aimerais faire ce week-end.'],
  ['Écriture','Continue : « En ouvrant la porte de la classe, j’ai découvert… »'],
  ['Écriture','Décris un animal sans écrire son nom. Quelqu’un doit pouvoir le deviner.'],
  ['Écriture','Écris une phrase contenant les mots école, mystère et matin.'],
  ['Écriture','Invente une devinette et écris la réponse à la fin.'],
  ['Écriture','Écris une phrase de 7 mots exactement, puis une phrase de 10 mots exactement.'],
  ['Français','Trouve 5 mots qui commencent par la lettre L.'],
  ['Français','Range dans l’ordre alphabétique : chat – arbre – maison – école – bateau.'],
  ['Français','Trouve 3 mots de la même famille que « chant ».'],
  ['Français','Pour « grand », trouve un synonyme puis un contraire.'],
  ['Français','Transforme au pluriel : un petit chat noir / la grande maison / une voiture rouge.'],
  ['Français','Corrige : « les enfant joue dans la cour. »'],
  ['Français','Dans « Le petit chien court dans le jardin. », entoure le verbe et souligne le nom de l’animal.'],
  ['Français','Trouve un mot contenant chacun de ces sons : ou / on / oi / an.'],
  ['Lecture','Lis une page de ton livre puis écris une phrase qui raconte ce que tu as compris.'],
  ['Lecture','Choisis un personnage de ton livre et écris 3 mots pour le décrire.'],
  ['Lecture','Trouve dans ton livre un nom, un verbe et un adjectif.'],
  ['Créativité','Dessine un animal imaginaire composé de 3 animaux différents, puis donne-lui un nom.'],
  ['Créativité','Dessine une maison uniquement avec des formes géométriques et nomme au moins 4 formes utilisées.'],
  ['Créativité','Invente une énigme pour un camarade de CE2 et vérifie qu’elle possède une réponse.']
];
const emoji={Maths:'🔢',Français:'🔎',Écriture:'✏️',Lecture:'📖',Créativité:'🎨'};
let category='Tous';
let current=-1;
function pool(){return challenges.map((c,i)=>({...c,cat:c[0],txt:c[1],i})).filter(x=>category==='Tous'||x.cat===category)}
function show(i){current=i; const c=challenges[i]; document.getElementById('badge').textContent=`${emoji[c[0]]} ${c[0]}`; document.getElementById('num').textContent=`Défi n°${i+1}`; document.getElementById('text').textContent=c[1];}
function randomChallenge(){const p=pool(); if(!p.length)return; let pick=p[Math.floor(Math.random()*p.length)]; if(p.length>1&&pick.i===current){pick=p[(p.findIndex(x=>x.i===pick.i)+1)%p.length]} show(pick.i)}
function renderGrid(){const g=document.getElementById('grid'); g.innerHTML=''; pool().forEach(x=>{const d=document.createElement('article');d.className='mini';d.innerHTML=`<strong>${emoji[x.cat]} Défi n°${x.i+1} — ${x.cat}</strong><span>${x.txt}</span>`;g.appendChild(d)})}
document.querySelectorAll('.filter').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(b=>b.classList.remove('active'));btn.classList.add('active');category=btn.dataset.cat;renderGrid();randomChallenge()}));
document.getElementById('nextBtn').addEventListener('click',randomChallenge);
document.getElementById('randomBtn').addEventListener('click',randomChallenge);
document.getElementById('allBtn').addEventListener('click',()=>{const g=document.getElementById('grid');g.classList.toggle('show');document.getElementById('allBtn').textContent=g.classList.contains('show')?'🙈 Masquer les défis':'📚 Voir tous les défis';renderGrid()});
randomChallenge();
</script>
</body>
</html>

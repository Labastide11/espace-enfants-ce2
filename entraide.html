<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entraide avec Nino — V0.19</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="entraide-v019.css">
</head>
<body>
  <main class="entraide-page">
    <div class="entraide-topbar">
      <a class="back" href="index.html">← Accueil</a>
      <span class="mini-title">🤖 Entraide avec Nino</span>
    </div>

    <img class="entraide-page-banner"
         src="assets/bandeau-entraide.png"
         alt="Entraide avec Nino">

    <p class="entraide-instruction">
      Clique sur ta photo pour changer de colonne.
    </p>

    <section class="entraide-board" aria-label="Tableau d'entraide de la classe">
      <section class="entraide-column column-work">
        <div class="student-column-grid" id="work-list"></div>
      </section>

      <section class="entraide-column column-help">
        <div class="student-column-grid" id="help-list"></div>
      </section>

      <section class="entraide-column column-need">
        <div class="student-column-grid" id="need-list"></div>
      </section>
    </section>

    <div class="choice-popover" id="choice-popover" hidden aria-live="polite">
      <div class="choice-card">
        <button class="choice-close" id="choice-close" type="button" aria-label="Fermer">×</button>
        <div class="choice-student" id="choice-student"></div>
        <p>Où veux-tu aller ?</p>
        <div class="choice-buttons">
          <button type="button" data-state="neutral">📘 Je travaille</button>
          <button type="button" data-state="helper">🤝 Je peux aider</button>
          <button type="button" data-state="need">🙋 J’ai besoin d’aide</button>
        </div>
      </div>
    </div>

    <div class="version-badge">V0.19</div>
  </main>

  <script src="eleves-manifest.js"></script>
  <script src="entraide-v019.js"></script>
</body>
</html>

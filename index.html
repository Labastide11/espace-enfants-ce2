<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notre classe CE2 — Nino</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="nino" aria-hidden="true">🤖</div>
      <div>
        <p class="eyebrow">Notre espace à nous</p>
        <h1>Notre classe CE2</h1>
        <p class="hello">Bonjour ! Moi, c’est <strong>Nino</strong>.<br>Que veux-tu faire ?</p>
      </div>
    </header>

    <section class="cards" aria-label="Choisir une rubrique">
      <button class="card card-help" data-action="help">
        <span class="icon">🤝</span>
        <span class="title">J’aide</span>
        <span class="subtitle">J’aide un camarade ou je cherche de l’aide.</span>
      </button>

      <button class="card card-choice" data-action="choice">
        <span class="icon">🧭</span>
        <span class="title">Je ne sais pas quoi faire</span>
        <span class="subtitle">Nino m’aide à choisir.</span>
      </button>

      <button class="card card-jobs" data-action="jobs">
        <span class="icon">🧹</span>
        <span class="title">Mes responsabilités</span>
        <span class="subtitle">Je regarde ma mission de la semaine.</span>
      </button>
    </section>

    <section class="coming-soon" id="message" aria-live="polite">
      <strong>Première version :</strong> on prépare l’accueil. Les rubriques seront ajoutées une par une.
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
